<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms and Input tag</title>
  </head>
  <body>
    <h1>Student Regristration Form</h1>
    <form action="post">
      <div>
        <label for="FullName">Name</label>
        <input
          type="text"
          name="Full Name"
          id="FullName"
          placeholder="Enter Your Full Name"
          required
        />
      </div>
      <div>
        <label for="Email">Email</label>
        <input
          type="email"
          name="Email"
          id="Email"
          placeholder="Enter Your Email"
          required
        />
      </div>
      <div>
        <label for="MobileNumber">Phone Number</label>
        <input
          type="number"
          name="MobileNumber"
          id="MobileNumber"
          placeholder="Enter Your Number"
          required
        />
      </div>
      <div>
        <label for="Gender">Select Your Gender: </label>
        <br />
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" />
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" />
        <label for="prefernottosay">Prefer not to say</label>
        <input type="radio" name="gender" id="prefernottosay" />
      </div>
      <div>
        <label for="Courseselection">Select Your Course</label>
        <select name="Courseselection" id="Courseselection">
          <option value="BBA">BBA</option>
          <option value="Bcom">Bcom</option>
          <option value="BCA">BCA</option>
          <option value="MBA">MBA</option>
        </select>
      </div>
      <div>
        <label for="Photo">Upload Your Photo:</label>
        <input type="file" name="Photo" id="Photo" accept="image/*" />
      </div>
      <div>
        <label for="Address">Address</label>
        <textarea
          name="Address"
          id="Address"
          placeholder="Enter Your Address"
        ></textarea>
      </div>
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
