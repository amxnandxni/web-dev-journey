<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Images, Lists, and Tables</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Images</h1>
    <img width="350" src="image.png" alt="web dev career path" />
    <br />
    <h1>Tables</h1>
    <table>
      <caption>
        Employee Details
      </caption>
      <thead>
        <tr>
          <th>Name</th>
          <th>Designation</th>
          <th>Salary</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Dhoni</td>
          <td>Manager</td>
          <td>50000</td>
        </tr>
        <tr>
          <td>Virat</td>
          <td>Assistant</td>
          <td>18000</td>
        </tr>
        <tr>
          <td>Rohit</td>
          <td>Intern</td>
          <td>Free</td>
        </tr>
      </tbody>
    </table>
    <br />
    <h1>Lists</h1>
    <ul type="circle">
      <li>Hamilton</li>
      <li>Verstappen</li>
      <li>Leclerc</li>
      <li>George</li>
      <li>Piastri</li>
    </ul>
    <ol type="I">
      <li>Sainz</li>
      <li>Norris</li>
      <li>Hadjar</li>
      <li>Antonelli</li>
    </ol>
  </body>
</html>
