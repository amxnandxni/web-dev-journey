<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 23 Netflix Clone</title>
    <link rel="stylesheet" href="Day23.css">
</head>
<body>
    <div class="bg">
        <nav class="navbar">
            <div><img src="Assets/images/logo.svg" alt="" class="logo"></div>
            <div class="btn">
                <button class="eng">English</button>
                <button class="sign">Sign In</button>
            </div>
        </nav>
        <div class="box"></div>
        <div class="content">
        <div class="big">
            Unlimited movies, shows, and more
        </div>
        <div class="price">
            Starts at ₹149. Cancel at any time.
        </div>
        <div class="small">
            Ready to watch? Enter your email to create or restart your membership.
        </div>
        <div class="mail">
            <input type="text" placeholder="Email address">
            <button class="start">Get Started</button>
        </div>
        </div>
    </div>
    <div class="curve"></div>
</body>
</html>
