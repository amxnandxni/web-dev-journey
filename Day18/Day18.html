<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 18- CSS Grid</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: auto auto 1fr auto;
            gap: 20px;
            padding: 20px;
        }
        .navbar{
            text-align: center;
            border: 2px solid grey;
            grid-column: 1/3;
        }
        .hero{
            grid-column: 1/4;
            text-align: center;
        }
        .cards{
            grid-column: 2;
        }
        .card{
            background-color: lightgrey;
            padding: 30px;
            text-align: center;
            border: 2px solid black;
        }
        .footer{
            grid-column: 1/3;
            text-align: center;
            border: 2px solid grey;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">Navbar</nav>
        <seciton class="hero">
            <h1>Grid Practice</h1>
        </seciton>
        <section class="cards">
            <div class="card">1</div>
            <div class="card">2</div>
            <div class="card">3</div>
            <div class="card">4</div>
            <div class="card">5</div>
            <div class="card">6</div>
        </section>
        <footer class="footer">Footer</footer>
    </div>
</body>
</html>
